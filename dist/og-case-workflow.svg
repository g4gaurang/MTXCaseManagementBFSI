    <path d="M320 386h55" stroke="#4fd1d9" stroke-width="3"/><path d="m366 377 12 9-12 9" fill="none" stroke="#4fd1d9" stroke-width="3"/>
    <g transform="translate(390 330)"><rect width="220" height="112" rx="14" fill="#102b48" stroke="#2a5979"/><text x="110" y="50" fill="#a8c8d7">02</text><text x="110" y="79" fill="white" font-weight="700">Staff review</text></g>
    <path d="M620 386h55" stroke="#4fd1d9" stroke-width="3"/><path d="m666 377 12 9-12 9" fill="none" stroke="#4fd1d9" stroke-width="3"/>
    <g transform="translate(690 330)"><rect width="220" height="112" rx="14" fill="#102b48" stroke="#2a5979"/><text x="110" y="50" fill="#a8c8d7">03</text><text x="110" y="79" fill="white" font-weight="700">Authorized action</text></g>
    <path d="M920 386h55" stroke="#4fd1d9" stroke-width="3"/><path d="m966 377 12 9-12 9" fill="none" stroke="#4fd1d9" stroke-width="3"/>
