  <text x="90" y="180" fill="white" font-family="Arial, sans-serif" font-size="46" font-weight="700">From customer request to</text>
  <text x="90" y="238" fill="white" font-family="Arial, sans-serif" font-size="46" font-weight="700">documented resolution.</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
